<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单词库 · Robotics English Lab</title>
  <link rel="stylesheet" href="learning-assets/workspace.css">
  <link rel="stylesheet" href="learning-assets/vocabulary-library.css">
</head>
<body class="lab-page vocab-page" data-page="vocabulary">
  <div data-site-header></div>
  <main id="main-content" class="lab-main vocab-main">
    <header class="vocab-heading">
      <div><h1>单词库</h1><p class="vocab-progress">共 <span id="summary-total">0</span> 词 · 已掌握 <span id="summary-mastered">0</span> 词（自评）</p></div>
      <button type="button" class="vocab-primary" id="start-flashcards">开始背词 · 5 个</button>
    </header>
    <p id="storage-note" class="vocab-notice" role="status" hidden></p>
    <section id="library-view" aria-label="查阅词库">
      <div class="vocab-tools">
        <label class="vocab-search" for="vocab-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span class="vocab-sr-only">搜索英文、中文、例句或来源</span><input id="vocab-search" type="search" placeholder="搜索英文、中文或例句" autocomplete="off"></label>
        <div class="vocab-filter-row">
          <div class="vocab-status-filters" role="group" aria-label="按自评状态筛选"><button type="button" data-status="all" aria-pressed="true">全部</button><button type="button" data-status="unmastered" aria-pressed="false">待复习</button><button type="button" data-status="mastered" aria-pressed="false">已掌握</button></div>
          <button type="button" id="toggle-filters" class="vocab-text-button" aria-expanded="false" aria-controls="extra-filters">筛选 <span aria-hidden="true">⌄</span></button>
        </div>
        <div id="extra-filters" class="vocab-extra-filters" hidden>
          <div class="vocab-pos-filters" role="group" aria-label="按词性筛选"><button type="button" data-filter="all" aria-pressed="true">所有词性</button><button type="button" data-filter="n." aria-pressed="false">名词</button><button type="button" data-filter="v." aria-pressed="false">动词</button><button type="button" data-filter="adj." aria-pressed="false">形容词</button><button type="button" data-filter="adv." aria-pressed="false">副词</button><button type="button" data-filter="prep." aria-pressed="false">介词</button></div>
          <label class="vocab-phrase-filter"><input type="checkbox" id="phrase-only">只看短语 / 缩写</label><p>词性与短语可组合筛选，例如“名词 + 短语”。</p>
        </div>
      </div>
      <p id="vocab-results" class="vocab-results" role="status"><span id="summary-visible">0</span> 个词 · 展开例句可查看来源与自评</p>
      <div id="vocab-list" class="vocab-list"></div>
      <div id="vocab-empty" class="vocab-empty" hidden><p>没有匹配的词汇。试试其他关键词或筛选条件。</p><button type="button" id="reset-filters" class="vocab-secondary">清除搜索和筛选</button></div>
    </section>
    <section id="flashcard-view" class="flashcard-view" aria-label="背词练习" hidden>
      <div class="flashcard-toolbar"><p id="flash-progress"></p><button type="button" id="exit-session" class="vocab-text-button">返回词库</button></div><div id="flashcard-content"></div>
    </section>
    <section id="vocab-player" class="vocab-player" aria-label="单词发音播放器" hidden>
      <div class="vocab-player-top"><p id="player-word" lang="en"></p><label class="vocab-loop"><input id="audio-loop" type="checkbox">循环</label><button type="button" id="restart-audio" class="vocab-text-button">从头播放</button><button type="button" id="close-player" class="vocab-text-button vocab-close-player" aria-label="暂停并收起播放器"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
      <audio id="vocab-audio" controls preload="none" aria-label="单词发音"></audio><p id="audio-note" class="vocab-audio-note" role="status" hidden></p>
    </section>
  </main>
  <footer class="site-footer">记录保存在当前浏览器 · “已掌握”为个人自评，可随时调整</footer>
  <div data-site-nav></div>
  <script src="learning-assets/vocabulary-data.js"></script>
  <script src="learning-assets/vocabulary-library.js"></script>
  <script src="learning-assets/workspace.js"></script>
</body>
</html>
